<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理面板</title>
<style>
  /* 視覺規範 v2 tokens（tokens.json） */
  :root {
    --primary:#4F7A6A; --primary-dark:#3D6153; --primary-light:#EEF4F1;
    --accent:#E8C27A; --accent-light:#FBF3E2; --accent-text:#8A5A1F;
    --text:#111827; --text-2:#4B5563; --text-3:#6B7280; --border:#E5E7EB; --bg:#F7F8FA; --surface:#FFFFFF;
    --warning:#B45309; --danger:#B91C1C; --danger-light:#FEE2E2; --muted-bg:#F3F4F6;
    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s12:48px;
    --r-sm:8px; --r-md:12px; --r-pill:999px; --shadow:0 1px 2px rgba(17,24,39,.06); --side:240px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); color:var(--text); background:var(--bg); font-size:16px; line-height:24px; font-variant-numeric:tabular-nums; }
  .側 { background:var(--primary-dark); color:#fff; }
  .側 .logo { display:block; background:var(--surface); border-radius:var(--r-sm); padding:var(--s2) var(--s3); margin-bottom:var(--s4); }
  .側 .logo img { display:block; width:100%; height:auto; }
  .側 h1 { margin:0; font-size:16px; line-height:24px; font-weight:700; color:#fff; }
  .側 small { color:#fff; font-size:14px; line-height:20px; }
  nav button { border:0; background:none; font:inherit; font-size:16px; color:#fff; border-radius:var(--r-sm); cursor:pointer; text-align:left; }
  nav button:hover { background:rgba(255,255,255,.08); }
  nav button.on { background:var(--primary); font-weight:700; }
  main { padding:var(--s6) var(--s4); }
  .頁標 { font-size:32px; line-height:40px; font-weight:700; margin:0 0 var(--s6); }
  .卡 { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s5); margin-bottom:var(--s4); box-shadow:var(--shadow); }
  .格 { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--s4); margin-bottom:var(--s4); }
  .格 .卡 { margin:0; }
  .數 { font-size:36px; line-height:44px; font-weight:700; color:var(--text); }
  .標 { color:var(--text-2); font-size:14px; line-height:20px; }
  .列 { display:flex; align-items:center; gap:var(--s2); min-height:64px; padding:var(--s3) 0; border-bottom:1px solid var(--border); }
  .列:last-child { border-bottom:0; }
  .列 .主 { flex:1; min-width:0; overflow-wrap:anywhere; }
  .列 > button { flex:none; white-space:nowrap; }
  .列 .副, .副 { color:var(--text-3); font-size:14px; line-height:20px; }
  /* 狀態標籤：一律「符號＋文字」；字色用 primary-dark，不用 primary */
  .徽 { display:inline-flex; align-items:center; gap:4px; font-size:14px; line-height:20px; font-weight:700; padding:2px 10px; border-radius:var(--r-pill); background:var(--muted-bg); color:var(--text-2); margin-left:var(--s1); white-space:nowrap; flex:none; vertical-align:middle; }
  .徽.進 { background:var(--primary-light); color:var(--primary-dark); }
  .徽.待 { background:var(--accent-light); color:var(--accent-text); }
  .徽.結 { background:var(--muted-bg); color:var(--text-2); }
  .徽.危 { background:var(--danger-light); color:var(--danger); }
  .徽.管 { background:var(--primary-light); color:var(--primary-dark); }
  button.鈕 { font:inherit; font-size:16px; font-weight:700; min-height:44px; padding:0 var(--s4); border:1px solid var(--border); background:var(--surface); color:var(--primary-dark); border-radius:var(--r-sm); cursor:pointer; }
  button.鈕:hover { border-color:var(--primary-dark); }
  button.主鈕 { background:var(--primary); color:#fff; border-color:var(--primary); }
  button.主鈕:hover { background:var(--primary-dark); border-color:var(--primary-dark); }
  button.鈕:disabled { background:var(--border); color:var(--text-3); border-color:var(--border); cursor:not-allowed; }
  button.紅鈕 { color:var(--danger); }
  .鈕列 { display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  input, select { font:inherit; font-size:16px; min-height:44px; padding:0 var(--s3); border:1px solid var(--border); border-radius:var(--r-sm); width:100%; background:var(--surface); color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--primary); outline-offset:1px; }
  input[type=checkbox] { width:22px; height:22px; min-height:0; accent-color:var(--primary); }
  .搜 { margin-bottom:var(--s4); }
  h3 { margin:var(--s6) 0 var(--s3); font-size:22px; line-height:30px; font-weight:700; color:var(--text); }
  .設值 { width:140px; flex:none; }
  .自訂 { color:var(--accent-text); font-size:14px; font-weight:700; }
  .發 { color:var(--primary-dark); } .收 { color:var(--danger); }
  .條軌 { height:10px; background:var(--border); border-radius:5px; overflow:hidden; }
  .條 { height:10px; background:var(--accent); border-radius:5px; }
  .提示 { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:#fff; padding:var(--s3) var(--s4); border-radius:var(--r-sm); font-size:14px; opacity:0; transition:.3s; pointer-events:none; max-width:90%; z-index:20; }
  .提示.顯 { opacity:1; }
  .遮 { position:fixed; inset:0; background:rgba(17,24,39,.4); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .遮.顯 { display:flex; }
  .窗 { background:var(--surface); width:100%; max-width:480px; border-radius:var(--r-md) var(--r-md) 0 0; padding:var(--s5); }
  .窗 label { display:block; margin:var(--s3) 0 var(--s1); color:var(--text-2); font-size:14px; }
  .窗 .鈕列 { margin-top:var(--s4); }
  .窗 .鈕列 button { flex:1; }
  .空 { text-align:center; color:var(--text-3); padding:var(--s8) 0; }
  .錯 { background:var(--danger-light); color:var(--danger); padding:var(--s5); border-radius:var(--r-md); text-align:center; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:var(--s3) var(--s2); border-bottom:1px solid var(--border); vertical-align:middle; text-align:left; }
  tr.表頭 td { background:var(--bg); color:var(--text-2); font-weight:700; height:48px; }
  /* 手機：上方標題＋可橫捲分頁 */
  .側 { position:sticky; top:0; z-index:5; padding:var(--s3) var(--s4) 0; }
  .側 .logo { display:none; }
  nav { display:flex; overflow-x:auto; gap:var(--s1); padding:var(--s2) 0; }
  nav button { flex:none; padding:var(--s2) var(--s3); }
  /* 桌面（≥1024px）：側欄 240px、KPI 4 欄、內容左右 32px */
  @media (min-width:1024px) {
    body { display:flex; min-height:100vh; }
    .側 { position:relative; align-self:stretch; min-height:100vh; width:var(--side); flex:none; padding:0; }
    .側內 { position:sticky; top:0; max-height:100vh; overflow-y:auto; padding:var(--s6) var(--s4); }
    .側 .logo { display:block; }
    nav { flex-direction:column; overflow:visible; padding:var(--s6) 0 0; }
    nav button { padding:var(--s2) var(--s4); min-height:44px; }
    main { flex:1; min-width:0; padding:var(--s8); max-width:1200px; }
    .格 { grid-template-columns:repeat(4,1fr); }
    .遮 { align-items:center; } .窗 { border-radius:var(--r-md); }
  }
</style>
</head>
<body>
<aside class="側"><div class="側內">
<span class="logo"><img src="logo_horizontal.png" alt="任務點 MISSION POINTS"></span>
<h1 id="組織">管理面板</h1><small id="我"></small>
<nav id="分頁">
  <button data-頁="總覽" class="on">總覽</button>
  <button data-頁="成員">成員</button>
  <button data-頁="任務">任務</button>
  <button data-頁="統計">統計</button>
  <button data-頁="設定">設定</button>
  <button data-頁="紀錄">紀錄</button>
  <button data-頁="權限" style="display:none">👑 權限</button>
  <button data-頁="開發者" style="display:none">🛠 開發者</button>
</nav>
</div></aside>
<main id="內容"><div class="空">載入中…（第一次約 5~15 秒）</div></main>

<div class="遮" id="遮"><div class="窗" id="窗"></div></div>
<div class="提示" id="提示"></div>

<script>
/* 靜態版：參數放在網址 # 後面（不會送到任何伺服器） */
var 參 = {};
location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) 參[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
var 通行碼 = 參.t || '';
var API = 參.api || '';
if (通行碼) history.replaceState(null, '', location.pathname);   // 網址列不留通行碼
var 序 = 0;
var D = null, 頁 = '總覽', 搜 = '', S = null, S區 = '本月', S載 = false, 勾 = {};

function $(id) { return document.getElementById(id); }
function 跳脫(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function 提示(s) { var e = $('提示'); e.textContent = s; e.classList.add('顯'); setTimeout(function () { e.classList.remove('顯'); }, 2500); }

/* fetch 呼叫：credentials:'omit' 不帶 Google cookie，避開多帳號登入被擋 */
var 對照 = { 面板_資料: 'data', 面板_改設定: 'setting', 面板_調點: 'points', 面板_成員: 'member', 面板_任務: 'task', 面板_統計: 'stats', 面板_批次: 'batch', 面板_權限: 'perms', 面板_改權限: 'setperm', 面板_設主: 'setmaster', 面板_體檢: 'health', 面板_池儲值: 'pool' };
var 最後網址 = '';
function 呼叫(函式, 參數, 成功, 失敗, 重試) {
  function 錯(m) { 提示('❌ ' + m); }
  var 網 = API + '?p=api&a=' + 對照[函式] + '&t=' + encodeURIComponent(通行碼) + '&q=' + encodeURIComponent(JSON.stringify(參數));
  var 控 = window.AbortController ? new AbortController() : null;
  var 計 = setTimeout(function () { if (控) 控.abort(); }, 60000);
  fetch(網, { credentials: 'omit', redirect: 'follow', signal: 控 ? 控.signal : undefined })
    .then(function (r) { 最後網址 = r.url + '｜' + r.status + '｜' + (r.redirected ? '轉址' : '直達'); return r.text(); })
    .then(function (txt) {
      clearTimeout(計);
      var r; try { r = JSON.parse(txt); } catch (e) { if (!重試) { 呼叫(函式, 參數, 成功, 失敗, true); return; } var 摘 = txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160); throw new Error('伺服器回應異常［' + 最後網址.replace(/[?#].*?｜/, '｜') + '］' + (摘 || '（空白）').slice(0, 60)); }
      if (r.ok) 成功 && 成功(r.v); else (失敗 || 錯)(r.e);
    })
    .catch(function (e) { clearTimeout(計); (失敗 || 錯)(e.name === 'AbortError' ? '連線逾時，請重試' : (e.message || '連線失敗')); });
}

function 載入() {
  呼叫('面板_資料', [], function (d) {
    D = d; $('組織').textContent = d.組織 + '｜管理面板';
    $('我').textContent = '登入：' + d.我 + (d.身分 && d.身分 !== '管理員' ? '（' + d.身分 + '）' : '');
    套權限(); 畫();
  });
}

function 有(k) { return !D || !D.權限 || D.權限.indexOf(k) >= 0; }
/* 依權限顯示分頁：沒權限的頁不顯示 */
function 套權限() {
  var 需 = { 成員: '成員', 統計: '查詢', 設定: '設定', 紀錄: '查詢' };
  document.querySelectorAll('nav button').forEach(function (b) {
    var p = b.getAttribute('data-頁');
    var 顯 = p === '權限' ? (D.身分 === '開發者' || D.身分 === '主管理員') : p === '開發者' ? D.身分 === '開發者' : (!需[p] || 有(需[p]));
    b.style.display = 顯 ? '' : 'none';
  });
}

function 重載(訊息) { if (訊息) 提示(訊息); 載入(); }

document.querySelectorAll('nav button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on'); 頁 = b.getAttribute('data-頁'); 搜 = ''; 畫();
  };
});

function 畫() {
  if (!D) return;
  var h = { 總覽: 畫總覽, 成員: 畫成員, 任務: 畫任務, 統計: 畫統計, 設定: 畫設定, 紀錄: 畫紀錄, 權限: 畫權限, 開發者: 畫開發者 }[頁]();
  $('內容').innerHTML = '<h2 class="頁標">' + 頁 + '</h2>' + h;
  var s = $('搜尋'); if (s) { s.value = 搜; s.oninput = function () { 搜 = s.value; var p = s.selectionStart; 畫(); var n = $('搜尋'); n.focus(); n.setSelectionRange(p, p); }; }
}

function 畫總覽() {
  var o = D.總覽, n = D.點名;
  function 格(v, 標, 跳) { return '<div class="卡"' + (跳 ? ' onclick="去(\'' + 跳 + '\')" style="cursor:pointer"' : '') + '><div class="數">' + v + '</div><div class="標">' + 標 + '</div></div>'; }
  var 池 = o.池 || null, 千 = function (v) { return String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
  var 池區 = 池 ? '<div class="卡" style="margin-bottom:10px"><div class="列"><div class="主">💰 系統點數剩餘</div><div class="數" style="font-size:22px;color:' +
    (池.餘額 <= 0 ? '#B3261E' : 池.餘額 < 池.警告線 ? '#8A5A1F' : '#3D6153') + '">' + 千(池.餘額) + '</div></div>' +
    '<div class="副">本月發出 ' + 千(池.本月發出) + '｜累計儲值 ' + 千(池.累計儲值) + (池.餘額 <= 0 ? '｜⛔ 已用完，發點功能暫停，請聯絡開發者儲值' : 池.餘額 < 池.警告線 ? '｜⚠️ 偏低' : '') + '</div>' +
    (D.身分 === '開發者' ? '<div class="鈕列"><button class="鈕 主鈕" onclick="池儲(10000)">+10,000</button><button class="鈕 主鈕" onclick="池儲(100000)">+100,000</button><button class="鈕 主鈕" onclick="池儲(1000000)">+1,000,000</button><button class="鈕" onclick="池儲(0)">自訂／扣回</button></div>' : '') + '</div>' : '';
  var 池明 = (D.池明細 && D.池明細.length) ? '<h3>系統點數明細</h3><div class="卡">' + D.池明細.slice(0, 15).map(function (r) {
    return '<div class="列"><div class="主">' + 跳脫(r.時間) + ' ' + 跳脫(r.類別) + '<div class="副">' + 跳脫(r.說明.slice(0, 30)) + '</div></div><div>' + (r.數量 > 0 ? '+' : '') + 千(r.數量) + '</div></div>'; }).join('') + '</div>' : '';
  return 池區 + '<div class="格">' + 格(o.成員, '成員', '成員') + 格(o.待核准, '待核准', '成員') + 格(o.待審核, '待審核任務', '任務') +
    格(o.進行中, '進行中任務', '任務') + 格('+' + o.本月發出, '本月發出' + n) + 格(o.本月回收, '本月回收' + n) + '</div>' +
    '<h3>點數前 5 名</h3><div class="卡">' + D.成員.slice(0, 5).map(function (m, i) {
      return '<div class="列"><div class="主">' + (i + 1) + '. ' + 跳脫(m.名字) + '</div><div>' + m.點數 + ' ' + 跳脫(n) + '</div></div>';
    }).join('') + '</div>' + 池明;
}
function 池儲(n) {
  if (!n) { var v = prompt('輸入儲值數量（扣回請加負號，例如 -5000）'); if (!v) return; n = Number(String(v).replace(/[,\s]/g, '')); if (!n) return 提示('❌ 請輸入整數'); }
  if (!confirm((n > 0 ? '儲值 +' : '扣回 ') + n + '？')) return;
  呼叫('面板_池儲值', [n], function (x) { 提示('✅ ' + x); 重載(); }, function (e) { 提示('❌ ' + e); });
}

function 去(p) { document.querySelector('nav button[data-頁="' + p + '"]').click(); }

function 畫成員() {
  var 列 = D.成員.filter(function (m) { return !搜 || m.名字.indexOf(搜) >= 0; });
  var 待 = 列.filter(function (m) { return m.狀態 === '待核准'; }), 正 = 列.filter(function (m) { return m.狀態 !== '待核准'; });
  var h = '<input id="搜尋" class="搜" placeholder="搜尋名字">';
  if (待.length) h += '<h3>待核准</h3><div class="卡">' + 待.map(function (m) {
    return '<div class="列"><div class="主">' + 跳脫(m.名字) + '<span class="徽 危">! 待核准</span><div class="副">申請 ' + m.加入 + '</div></div>' +
      '<button class="鈕 主鈕" onclick="成員(\'成員核准\',\'' + m.u + '\')">核准</button><button class="鈕 紅鈕" onclick="成員(\'成員停用\',\'' + m.u + '\',\'拒絕 ' + 跳脫(m.名字) + '？\')">拒絕</button></div>';
  }).join('') + '</div>';
  var 勾數 = Object.keys(勾).filter(function (k) { return 勾[k]; }).length;
  if (有('點數')) h += '<div class="鈕列" style="justify-content:space-between;align-items:center"><span class="副">勾選後可一次調多人</span>' +
    '<span><button class="鈕" onclick="全勾(' + (勾數 ? 'false' : 'true') + ')">' + (勾數 ? '全部取消' : '全選') + '</button>' +
    '<button class="鈕 主鈕" onclick="批次窗()"' + (勾數 ? '' : ' disabled') + '>👥 批次調點（' + 勾數 + '）</button></span></div>';
  h += '<h3>成員（' + 正.length + '）</h3><div class="卡">' + (正.length ? 正.map(function (m) {
    return '<div class="列">' + (有('點數') ? '<input type="checkbox" style="width:auto;margin-right:8px" ' + (勾[m.u] ? 'checked ' : '') + 'onclick="勾選(\'' + m.u + '\', this.checked)">' : '') + '<div class="主">' + 跳脫(m.名字) + (m.角色 === '管理員' ? '<span class="徽 管">★ 管理員</span>' : '') + (m.狀態 === '停用' ? '<span class="徽 結">○ 已停用</span>' : '') +
      '<div class="副">' + m.點數 + ' ' + 跳脫(D.點名) + (m.優先卡 ? '｜優先卡 ' + m.優先卡 : '') + '｜加入 ' + m.加入 + '</div></div>' +
      (有('點數') ? '<button class="鈕" onclick="調點窗(\'' + m.u + '\')">調點</button>' : '') + (有('成員') ? '<button class="鈕" onclick="成員選單(\'' + m.u + '\')">⋯</button>' : '') + '</div>';
  }).join('') : '<div class="空">沒有符合的成員</div>') + '</div>';
  return h;
}

function 勾選(u, v) { 勾[u] = v; 畫(); }
function 全勾(v) { 勾 = {}; if (v) D.成員.forEach(function (m) { if (m.狀態 === '正常' && (!搜 || m.名字.indexOf(搜) >= 0)) 勾[m.u] = true; }); 畫(); }
function 批次窗() {
  var 名單 = Object.keys(勾).filter(function (k) { return 勾[k]; });
  if (!名單.length) return;
  var 名 = 名單.slice(0, 10).map(function (u) { var m = 找員(u); return m ? 跳脫(m.名字) : '?'; }).join('、') + (名單.length > 10 ? ' 等' : '');
  開窗('<b>批次調整 ' + 名單.length + ' 人</b><div class="副">' + 名 + '</div>' +

      else 控 = '<input class="設值" ' + (s.型別 === '數字' ? 'type="number" step="any" inputmode="decimal"' : '') + ' value="' + 跳脫(s.值) + '" onchange="改(\'' + s.鍵 + '\', this.value, this)">';
      var 副 = [];
      if (s.型別 === '數字') 副.push(s.最小 + '~' + s.最大);
      副.push('預設 ' + (s.型別 === '是否' ? (s.預設 ? '開' : '關') : s.預設));
      if (s.說明) 副.push(s.說明);
      return '<div class="列"><div class="主">' + 跳脫(s.名) + (s.自訂 ? ' <span class="自訂">自訂 · <a href="#" onclick="改(\'' + s.鍵 + '\',\'\',null);return false">恢復預設</a></span>' : '') +
        '<div class="副">' + 跳脫(副.join('｜')) + '</div></div>' + 控 + '</div>';
    }).join('') + '</div>';
  });
  return h;
}

function 改(鍵, 值, 元件) {
  if (元件) 元件.disabled = true;
  呼叫('面板_改設定', [鍵, 值], function (x) { 重載('✅ ' + x); });
  setTimeout(function () { if (元件) 元件.disabled = false; }, 3000);
}

function 畫紀錄() {
  var 列 = D.紀錄.filter(function (r) { return !搜 || (r.誰 + r.動作 + r.對象 + r.後).indexOf(搜) >= 0; });
  return '<input id="搜尋" class="搜" placeholder="搜尋（人名、動作…）"><div class="卡"><table>' + (列.length ? 列.map(function (r) {
    return '<tr><td style="white-space:nowrap;color:var(--text-3)">' + 跳脫(r.時間) + '</td><td><b>' + 跳脫(r.誰) + '</b> ' + 跳脫(r.動作) +
      (r.對象 ? ' ' + 跳脫(r.對象) : '') + (r.後 ? '<div class="副">' + (r.前 ? 跳脫(r.前) + ' → ' : '') + 跳脫(r.後) + (r.結果 && r.結果 !== '成功' ? '（' + 跳脫(r.結果) + '）' : '') + '</div>' : '') + '</td></tr>';
  }).join('') : '<tr><td class="空">沒有紀錄</td></tr>') + '</table><div class="副" style="margin-top:8px">顯示最近 100 筆</div></div>';
}

function 開窗(h) { $('窗').innerHTML = h; $('遮').classList.add('顯'); }
function 關窗() { $('遮').classList.remove('顯'); }
$('遮').onclick = function (e) { if (e.target === $('遮')) 關窗(); };

if (!通行碼) $('內容').innerHTML = '<div class="錯">請從 LINE 打「管理 面板」取得連結。</div>';
else 呼叫('面板_資料', [], function (d) { D = d; $('組織').textContent = d.組織 + '｜管理面板'; $('我').textContent = '登入：' + d.我 + '｜伺服器 ' + (d.耗時 / 1000).toFixed(1) + ' 秒'; 畫(); },
  function (m) { $('內容').innerHTML = '<div class="錯">' + 跳脫(m) + '</div>'; });
</script>
</body>
</html>
